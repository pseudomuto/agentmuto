name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install mise and tools
        uses: jdx/mise-action@v4

      - name: Validate
        run: mise run validate

  commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install mise and tools
        uses: jdx/mise-action@v4

      - name: Lint commit messages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE..HEAD"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # First push to a new repository, or a newly created branch. There
            # is no prior ref to diff against, so lint everything reachable.
            range="HEAD"
          else
            range="$BEFORE..HEAD"
          fi
          printf 'linting range: %s\n' "$range"
          # committed lints exactly the revision it is handed. Given a single
          # ref like HEAD it checks that one commit and silently ignores every
          # ancestor, so a bad commit behind the tip would pass. Enumerate with
          # rev-list and lint one commit at a time. Verified: a repo with a
          # bogus root and a valid tip exits 0 for `committed HEAD` and 1 for
          # this loop.
          #
          # --no-merges is required, not cosmetic. On a pull_request event
          # actions/checkout checks out the synthetic refs/pull/N/merge commit,
          # so HEAD is a merge commit GitHub generated with a message like
          # "Merge <sha> into <sha>". That message has no conventional type and
          # no human authored it, so linting it would fail every PR run
          # regardless of the contributor's actual commits. Verified against
          # this repo's real committed.toml: a merge commit in range exits 1,
          # and --no-merges exits 0.
          status=0
          for sha in $(git rev-list --no-merges "$range"); do
            mise exec -- committed "$sha" || status=1
          done
          exit "$status"

  release:
    needs: [validate, commits]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install mise and tools
        uses: jdx/mise-action@v4

      - name: Resolve version
        id: version
        run: |
          # Actions runs `bash -e {0}`, which has no pipefail. Without this
          # line a failure inside bare()'s pipeline is invisible: jq on empty
          # stdin prints nothing and exits 0, so current and next both come
          # back empty, compare equal, and the job reports "nothing to
          # release" and goes green having released nothing. Verified:
          # `bash -e -c 'v="$(false | jq -r ...)"'` yields an empty v and
          # exit 0. The deleted release.sh had `set -Eeuo pipefail`; dropping
          # it here was a regression.
          set -o pipefail

          # svu prints the version with the tag prefix attached, and
          # --tag.output '' does not strip it. Rebuilding from the JSON
          # components is what yields a bare version for the manifests.
          bare() {
            mise exec -- svu "$1" --tag.prefix muto--v --json \
              | jq -r '"\(.major).\(.minor).\(.patch)"'
          }
          current="$(bare current)"
          next="$(bare next)"

          # Belt and braces over pipefail: reject anything that is not bare
          # digits and dots. This also catches a regression in prefix
          # stripping, since `muto--v0.1.0` would fail the same test.
          for v in "$current" "$next"; do
            case "$v" in
              '' | *[!0-9.]*)
                printf 'error: refusing to release, bad version %s\n' "$v" >&2
                exit 1
                ;;
            esac
          done

          printf 'current=%s next=%s\n' "$current" "$next"
          if [ "$next" = "$current" ]; then
            printf 'no releasable commits, skipping\n'
            printf 'release=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'release=true\n' >> "$GITHUB_OUTPUT"
            printf 'version=%s\n' "$next" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump manifests
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tmp="$(mktemp)"
          jq --arg v "$VERSION" '.version = $v' \
            .claude-plugin/plugin.json > "$tmp"
          mv "$tmp" .claude-plugin/plugin.json
          jq --arg v "$VERSION" '.plugins[0].version = $v' \
            .claude-plugin/marketplace.json > "$tmp"
          mv "$tmp" .claude-plugin/marketplace.json
          git diff --stat

      - name: Validate the bumped manifests
        if: steps.version.outputs.release == 'true'
        run: mise run validate

      - name: Publish
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
          # The commit is conditional because the bump can legitimately be a
          # no-op: re-running after a partial publish where the push landed
          # but the tag did not, or a contributor hand-bumping the manifest in
          # a feat: PR. In those cases the manifests already carry the target
          # version, nothing stages, and an unconditional `git commit` exits 1
          # and kills the step before the tag command below, which is exactly
          # the command a manual re-run exists to reach. Verified against the
          # real manifest: unguarded exits 1, guarded continues.
          if git diff --cached --quiet; then
            printf 'manifests already at v%s, nothing to commit\n' "$VERSION"
          else
            git commit -m "chore(release): publish v$VERSION"
          fi
          # Push the branch before tagging. Marketplace caches are clones
          # tracking origin/main and they fetch no tags, so a tag on a commit
          # the remote does not have publishes nothing.
          git push origin main
          if git rev-parse -q --verify "refs/tags/muto--v$VERSION" >/dev/null; then
            printf 'tag muto--v%s already exists, nothing to tag\n' "$VERSION"
          else
            mise exec -- claude plugin tag --push -m "Release %s"
          fi
