[settings]
lockfile = true

[tools]
claude = "2.1"
jq = "1.8"
markdownlint-cli2 = "0.23"
"npm:skills-ref" = "0.1.5"
svu = "3.4"

[tasks.lint]
description = "Run linters"
run = [
  "markdownlint-cli2 '**/*.md' --config markdownlint.yaml",
  { task = "validate" },
]

[tasks.format]
description = "Format files"
run = ["markdownlint-cli2 '**/*.md' --config markdownlint.yaml --fix"]

[tasks.validate]
description = "Validate plugin manifests and skill frontmatter"
run = ["claude plugin validate --strict .", "./scripts/check-skills.sh"]

[tasks.release]
description = "Bump both manifests, validate, commit, push main, and tag. Usage: mise run release minor"
run = "./scripts/release.sh {{arg(name='bump')}}"
