[settings]
lockfile = true

[tools]
claude = "2.1"
codex = "0.147"
committed = "1.1"
jq = "1.8"
lefthook = "2.1"
markdownlint-cli2 = "0.23"
"npm:skills-ref" = "0.1.5"
svu = "3.4"

# A fresh clone gets working git hooks from `mise install` alone. Note this
# requires `mise trust` first, since mise refuses to run hooks from an
# untrusted config.
[hooks]
postinstall = "lefthook install"

[tasks.lint]
description = "Run linters"
run = [
  "markdownlint-cli2 '**/*.md' --config markdownlint.yaml",
  { task = "validate" },
]

[tasks.format]
description = "Format files"
run = ["markdownlint-cli2 '**/*.md' --config markdownlint.yaml --fix"]

[tasks.validate]
description = "Validate plugin manifests and skill frontmatter"
# Three skill trees to walk: `skills/` ships in the plugin, `.claude/skills/`
# is this repo's own tooling, and `.codex/skills` is a symlink to that tree so
# Codex finds the same project skills. The script takes the directory as its
# first argument and defaults to the shipped one.
#
# The `.codex/skills` line revalidates skills the previous line already
# covered, which is the point: it is what fails when that symlink dangles.
run = [
  "claude plugin validate --strict .",
  "./scripts/check-skills.sh",
  "./scripts/check-skills.sh .claude/skills",
  "./scripts/check-skills.sh .codex/skills",
  "./scripts/check-codex.sh",
]
