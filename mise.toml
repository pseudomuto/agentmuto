[settings]
lockfile = true

[tools]
claude = "2.1"
committed = "1.1"
jq = "1.8"
lefthook = "2.1"
markdownlint-cli2 = "0.23"
"npm:skills-ref" = "0.1.5"
svu = "3.4"

# A fresh clone gets working git hooks from `mise install` alone. Note this
# requires `mise trust` first, since mise refuses to run hooks from an
# untrusted config.
[hooks]
postinstall = "lefthook install"

[tasks.lint]
description = "Run linters"
run = [
  "markdownlint-cli2 '**/*.md' --config markdownlint.yaml",
  { task = "validate" },
]

[tasks.format]
description = "Format files"
run = ["markdownlint-cli2 '**/*.md' --config markdownlint.yaml --fix"]

[tasks.validate]
description = "Validate plugin manifests and skill frontmatter"
# Two skill trees to walk: `skills/` ships in the plugin, `.claude/skills/`
# is this repo's own tooling. The script takes the directory as its first
# argument and defaults to the shipped one.
run = [
  "claude plugin validate --strict .",
  "./scripts/check-skills.sh",
  "./scripts/check-skills.sh .claude/skills",
]
